<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Register - EasyCare</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "text-primary": "#1A1F36",
                        "admin-sidebar": "#1A1F36",
                        "tertiary": "#854100",
                        "primary": "#005596",
                        "on-tertiary-fixed": "#311300",
                        "on-background": "#181c21",
                        "on-secondary-container": "#00725e",
                        "on-secondary": "#ffffff",
                        "secondary-fixed": "#5ffbd6",
                        "on-error": "#ffffff",
                        "error": "#ba1a1a",
                        "on-secondary-fixed": "#002019",
                        "danger": "#EF4444",
                        "inverse-surface": "#2d3136",
                        "on-primary-fixed-variant": "#004880",
                        "on-error-container": "#93000a",
                        "secondary-container": "#5ffbd6",
                        "on-surface-variant": "#414751",
                        "inverse-primary": "#a1c9ff",
                        "surface-container-highest": "#e0e2e9",
                        "surface-bright": "#f8f9ff",
                        "warning": "#F59E0B",
                        "tertiary-fixed-dim": "#ffb786",
                        "on-tertiary-container": "#ffeadf",
                        "surface-container-low": "#f2f3fb",
                        "surface-container-high": "#e6e8ef",
                        "on-secondary-fixed-variant": "#005142",
                        "tertiary-container": "#aa5400",
                        "on-primary": "#ffffff",
                        "tertiary-fixed": "#ffdcc6",
                        "surface-tint": "#0060a8",
                        "surface-container-lowest": "#ffffff",
                        "primary-fixed": "#d3e4ff",
                        "on-tertiary-fixed-variant": "#723600",
                        "surface-container": "#eceef5",
                        "primary-fixed-dim": "#a1c9ff",
                        "secondary": "#006b58",
                        "on-primary-container": "#e6eeff",
                        "outline": "#717782",
                        "surface-dim": "#d8dae1",
                        "surface-variant": "#e0e2e9",
                        "text-secondary": "#6B7280",
                        "on-surface": "#181c21",
                        "inverse-on-surface": "#eff0f8",
                        "outline-variant": "#c1c7d3",
                        "error-container": "#ffdad6",
                        "secondary-fixed-dim": "#38debb",
                        "background": "#F4F7FB",
                        "surface": "#FFFFFF",
                        "on-tertiary": "#ffffff",
                        "primary-container": "#0a6ebd",
                        "on-primary-fixed": "#001c38"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "card-inner-padding": "1.5rem",
                        "container-padding": "2rem",
                        "section-gap": "3rem",
                        "sidebar-width": "260px",
                        "gutter": "1.5rem"
                    },
                    "fontFamily": {
                        "headline-lg": ["manrope"],
                        "label-sm": ["manrope"],
                        "body-md": ["manrope"],
                        "label-md": ["manrope"],
                        "headline-md": ["manrope"],
                        "display-lg": ["manrope"],
                        "body-lg": ["manrope"]
                    },
                    "fontSize": {
                        "headline-lg": ["32px", {"lineHeight": "1.3", "fontWeight": "600"}],
                        "label-sm": ["12px", {"lineHeight": "1.4", "letterSpacing": "0.05em", "fontWeight": "600"}],
                        "body-md": ["16px", {"lineHeight": "1.6", "fontWeight": "400"}],
                        "label-md": ["14px", {"lineHeight": "1.4", "letterSpacing": "0.02em", "fontWeight": "500"}],
                        "headline-md": ["24px", {"lineHeight": "1.4", "fontWeight": "600"}],
                        "display-lg": ["48px", {"lineHeight": "1.2", "fontWeight": "700"}],
                        "body-lg": ["18px", {"lineHeight": "1.6", "fontWeight": "400"}]
                    }
                },
            },
        }
    </script>
<style>
        .glass-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }
        .blob {
            position: absolute;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(0, 85, 150, 0.15) 0%, rgba(244, 247, 251, 0) 70%);
            border-radius: 50%;
            filter: blur(40px);
            z-index: -1;
        }
    </style>
</head>
<body class="bg-background font-body-md text-on-background min-h-screen relative overflow-x-hidden flex flex-col items-center justify-center py-12 px-4">
<!-- Abstract Background Decorations -->
<div class="blob -top-24 -left-24 animate-pulse"></div>
<div class="blob -bottom-24 -right-24 animate-pulse" style="animation-delay: 1s;"></div>
<div class="blob top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 opacity-50"></div>
<div class="w-full max-w-md">
<!-- Logo Header -->
<div class="text-center mb-8">
<div class="inline-flex items-center space-x-2">
<span class="material-symbols-outlined text-4xl text-primary" data-icon="medical_services" data-weight="fill" style="font-variation-settings: 'FILL' 1;">medical_services</span>
<span class="text-3xl font-extrabold tracking-tight text-primary font-headline-lg">EasyCare</span>
</div>
</div>
<!-- Registration Card -->
<div class="glass-card bg-surface p-8 rounded-[16px] shadow-[0px_4px_20px_rgba(0,0,0,0.05)] border border-white/20">
<div class="mb-8">
<h1 class="text-headline-md font-headline-md text-text-primary mb-2">Create your account</h1>
<p class="text-label-md font-label-md text-text-secondary">Join the EasyCare community today</p>
</div>
<form class="space-y-5">
<!-- Role Selector -->
<div class="space-y-2">
<label class="text-label-sm font-label-sm text-on-surface-variant uppercase tracking-wider">I am a...</label>
<div class="grid grid-cols-2 p-1 bg-surface-container-low rounded-full">
<button class="py-2 px-4 rounded-full text-label-md font-label-md bg-white shadow-sm text-primary transition-all" type="button">
                            Patient
                        </button>
<button class="py-2 px-4 rounded-full text-label-md font-label-md text-text-secondary hover:text-primary transition-all" type="button">
                            Doctor
                        </button>
</div>
</div>
<!-- Full Name -->
<div class="space-y-1.5">
<label class="text-label-sm font-label-sm text-on-surface-variant" for="name">Full Name</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline text-lg" data-icon="person">person</span>
<input class="w-full pl-10 pr-4 py-3 bg-white border border-outline-variant rounded-xl focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all outline-none text-body-md font-body-md" id="name" placeholder="John Doe" type="text"/>
</div>
</div>
<!-- Email -->
<div class="space-y-1.5">
<label class="text-label-sm font-label-sm text-on-surface-variant" for="email">Email Address</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline text-lg" data-icon="mail">mail</span>
<input class="w-full pl-10 pr-4 py-3 bg-white border border-outline-variant rounded-xl focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all outline-none text-body-md font-body-md" id="email" placeholder="name@example.com" type="email"/>
</div>
</div>
<!-- Phone -->
<div class="space-y-1.5">
<label class="text-label-sm font-label-sm text-on-surface-variant" for="phone">Phone Number</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline text-lg" data-icon="call">call</span>
<input class="w-full pl-10 pr-4 py-3 bg-white border border-outline-variant rounded-xl focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all outline-none text-body-md font-body-md" id="phone" placeholder="+1 (555) 000-0000" type="tel"/>
</div>
</div>
<!-- Password -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-4">
<div class="space-y-1.5">
<label class="text-label-sm font-label-sm text-on-surface-variant" for="password">Password</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline text-lg" data-icon="lock">lock</span>
<input class="w-full pl-10 pr-4 py-3 bg-white border border-outline-variant rounded-xl focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all outline-none text-body-md font-body-md" id="password" placeholder="••••••••" type="password"/>
</div>
</div>
<div class="space-y-1.5">
<label class="text-label-sm font-label-sm text-on-surface-variant" for="confirm-password">Confirm</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline text-lg" data-icon="shield">shield</span>
<input class="w-full pl-10 pr-4 py-3 bg-white border border-outline-variant rounded-xl focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all outline-none text-body-md font-body-md" id="confirm-password" placeholder="••••••••" type="password"/>
</div>
</div>
</div>
<!-- Register Button -->
<button class="w-full py-4 bg-primary hover:bg-primary-container text-white rounded-full font-label-md text-label-md transition-all active:scale-[0.98] shadow-lg shadow-primary/20 flex items-center justify-center space-x-2 mt-4" type="submit">
<span>Create Account</span>
<span class="material-symbols-outlined text-xl" data-icon="arrow_forward">arrow_forward</span>
</button>
</form>
<div class="mt-8 text-center">
<p class="text-body-md font-body-md text-text-secondary">
                    Already have an account? 
                    <a class="text-primary font-semibold hover:underline decoration-2 underline-offset-4" href="#">Login</a>
</p>
</div>
</div>
<!-- Footer Links -->
<div class="mt-8 flex justify-center space-x-6 text-label-sm font-label-sm text-outline">
<a class="hover:text-primary transition-colors" href="#">Privacy Policy</a>
<a class="hover:text-primary transition-colors" href="#">Terms of Service</a>
<a class="hover:text-primary transition-colors" href="#">Contact Us</a>
</div>
</div>
<!-- Decorative Bottom Gradient -->
<div class="fixed bottom-0 left-0 w-full h-1 bg-gradient-to-r from-primary via-secondary-container to-primary-fixed opacity-50"></div>
</body></html>
