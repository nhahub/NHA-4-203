<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "text-primary": "#1A1F36",
                        "admin-sidebar": "#1A1F36",
                        "tertiary": "#854100",
                        "primary": "#005596",
                        "on-tertiary-fixed": "#311300",
                        "on-background": "#181c21",
                        "on-secondary-container": "#00725e",
                        "on-secondary": "#ffffff",
                        "secondary-fixed": "#5ffbd6",
                        "on-error": "#ffffff",
                        "error": "#ba1a1a",
                        "on-secondary-fixed": "#002019",
                        "danger": "#EF4444",
                        "inverse-surface": "#2d3136",
                        "on-primary-fixed-variant": "#004880",
                        "on-error-container": "#93000a",
                        "secondary-container": "#5ffbd6",
                        "on-surface-variant": "#414751",
                        "inverse-primary": "#a1c9ff",
                        "surface-container-highest": "#e0e2e9",
                        "surface-bright": "#f8f9ff",
                        "warning": "#F59E0B",
                        "tertiary-fixed-dim": "#ffb786",
                        "on-tertiary-container": "#ffeadf",
                        "surface-container-low": "#f2f3fb",
                        "surface-container-high": "#e6e8ef",
                        "on-secondary-fixed-variant": "#005142",
                        "tertiary-container": "#aa5400",
                        "on-primary": "#ffffff",
                        "tertiary-fixed": "#ffdcc6",
                        "surface-tint": "#0060a8",
                        "surface-container-lowest": "#ffffff",
                        "primary-fixed": "#d3e4ff",
                        "on-tertiary-fixed-variant": "#723600",
                        "surface-container": "#eceef5",
                        "primary-fixed-dim": "#a1c9ff",
                        "secondary": "#006b58",
                        "on-primary-container": "#e6eeff",
                        "outline": "#717782",
                        "surface-dim": "#d8dae1",
                        "surface-variant": "#e0e2e9",
                        "text-secondary": "#6B7280",
                        "on-surface": "#181c21",
                        "inverse-on-surface": "#eff0f8",
                        "outline-variant": "#c1c7d3",
                        "error-container": "#ffdad6",
                        "secondary-fixed-dim": "#38debb",
                        "background": "#F4F7FB",
                        "surface": "#FFFFFF",
                        "on-tertiary": "#ffffff",
                        "primary-container": "#0a6ebd",
                        "on-primary-fixed": "#001c38"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "fontFamily": {
                        "headline-lg": ["manrope"],
                        "label-sm": ["manrope"],
                        "body-md": ["manrope"],
                        "label-md": ["manrope"],
                        "headline-md": ["manrope"],
                        "display-lg": ["manrope"],
                        "body-lg": ["manrope"]
                    },
                    "fontSize": {
                        "headline-lg": ["32px", {"lineHeight": "1.3", "fontWeight": "600"}],
                        "label-sm": ["12px", {"lineHeight": "1.4", "letterSpacing": "0.05em", "fontWeight": "600"}],
                        "body-md": ["16px", {"lineHeight": "1.6", "fontWeight": "400"}],
                        "label-md": ["14px", {"lineHeight": "1.4", "letterSpacing": "0.02em", "fontWeight": "500"}],
                        "headline-md": ["24px", {"lineHeight": "1.4", "fontWeight": "600"}],
                        "display-lg": ["48px", {"lineHeight": "1.2", "fontWeight": "700"}],
                        "body-lg": ["18px", {"lineHeight": "1.6", "fontWeight": "400"}]
                    }
                },
            },
        }
    </script>
<style>
        .glass-effect {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
        .bg-diagonal-gradient {
            background: linear-gradient(135deg, #F4F7FB 0%, #D3E4FF 100%);
        }
    </style>
</head>
<body class="bg-diagonal-gradient min-h-screen flex items-center justify-center p-6 font-body-md">
<div class="w-full max-w-md">
<!-- Main Card -->
<main class="bg-surface shadow-xl rounded-xl overflow-hidden border border-surface-container-highest/50">
<div class="p-8 md:p-10">
<!-- Branding Header -->
<div class="flex flex-col items-center mb-8 text-center">
<div class="flex items-center gap-2 mb-6">
<div class="w-10 h-10 bg-primary-container rounded-lg flex items-center justify-center">
<span class="material-symbols-outlined text-on-primary-container" style="font-variation-settings: 'FILL' 1;">medical_services</span>
</div>
<span class="font-headline-md text-primary tracking-tight">EasyCare</span>
</div>
<h1 class="font-headline-lg text-text-primary mb-2">Welcome back</h1>
<p class="font-body-md text-text-secondary">Please enter your details to access your portal.</p>
</div>
<!-- Form Section -->
<form class="space-y-6">
<!-- Email Field -->
<div class="space-y-2">
<label class="font-label-md text-on-surface-variant block" for="email">Email Address</label>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline group-focus-within:text-primary transition-colors" data-icon="mail">mail</span>
</div>
<input class="w-full pl-10 pr-4 py-3 bg-surface-container-lowest border border-outline-variant rounded-lg focus:ring-2 focus:ring-primary-container focus:border-primary outline-none transition-all font-body-md text-text-primary" id="email" name="email" placeholder="name@example.com" required="" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="space-y-2">
<div class="flex justify-between items-center">
<label class="font-label-md text-on-surface-variant block" for="password">Password</label>
<a class="font-label-sm text-primary hover:text-primary-container transition-colors" href="#">Forgot password?</a>
</div>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline group-focus-within:text-primary transition-colors" data-icon="lock">lock</span>
</div>
<input class="w-full pl-10 pr-4 py-3 bg-surface-container-lowest border border-outline-variant rounded-lg focus:ring-2 focus:ring-primary-container focus:border-primary outline-none transition-all font-body-md text-text-primary" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
</div>
<!-- Submit Button -->
<button class="w-full py-4 bg-primary-container text-on-primary-container font-label-md rounded-full hover:bg-primary transition-all duration-200 shadow-md active:scale-[0.98] flex items-center justify-center gap-2" type="submit">
                        Sign in
                        <span class="material-symbols-outlined text-[20px]" data-icon="arrow_forward">arrow_forward</span>
</button>
</form>
<!-- Divider -->
<div class="relative my-8">
<div class="absolute inset-0 flex items-center">
<div class="w-full border-t border-outline-variant"></div>
</div>
<div class="relative flex justify-center text-sm">
<span class="px-4 bg-surface text-outline font-label-sm">OR</span>
</div>
</div>
<!-- Admin Action -->
<div class="text-center">
<button class="w-full py-3 px-4 border border-outline-variant text-text-primary font-label-md rounded-full hover:bg-surface-container transition-colors flex items-center justify-center gap-2">
<span class="material-symbols-outlined text-primary" data-icon="admin_panel_settings">admin_panel_settings</span>
                        Sign in as Admin
                    </button>
</div>
</div>
<!-- Footer Text -->
<div class="px-8 py-6 bg-surface-container-low border-t border-surface-container-highest/50 text-center">
<p class="font-label-sm text-on-surface-variant">
                    Don't have an account? 
                    <a class="text-primary font-semibold hover:underline decoration-2 underline-offset-4 transition-all" href="#">Contact your provider</a>
</p>
</div>
</main>
<!-- Auxiliary Links -->
<footer class="mt-8 flex justify-center space-x-6">
<a class="font-label-sm text-text-secondary hover:text-primary transition-colors" href="#">Privacy Policy</a>
<a class="font-label-sm text-text-secondary hover:text-primary transition-colors" href="#">Terms of Service</a>
<a class="font-label-sm text-text-secondary hover:text-primary transition-colors" href="#">Help Center</a>
</footer>
</div>
<!-- Decorative Elements (Glassmorphism blobs for premium feel) -->
<div class="fixed top-[-10%] right-[-5%] w-[400px] h-[400px] bg-primary-fixed-dim/30 rounded-full blur-[100px] -z-10"></div>
<div class="fixed bottom-[-10%] left-[-5%] w-[350px] h-[350px] bg-secondary-fixed-dim/20 rounded-full blur-[80px] -z-10"></div>
</body></html>
